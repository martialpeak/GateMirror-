name: Generate SSTP and OpenVPN Links

on:
  schedule:
    - cron: '0 */4 * * *'   # هر ۴ ساعت یک‌بار
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sstp:// and ovpn:// links with country names
        run: python3 build_sstp_links.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sstp_links.txt ovpn_links.txt ovpn-repo.txt ovpn-repo-names.txt openvpn_links.txt country_cache.json docs/ 2>/dev/null || git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update links (SSTP & OpenVPN) $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
